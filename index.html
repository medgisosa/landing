const ThemeContext = React.createContext(THEMES.noir)
const useTheme = () => React.useContext(ThemeContext)

/* ── Hooks ───────────────────────────────────────────────── */
function useReveal(threshold = 0.12) {
  const ref = React.useRef(null)
  const [vis, setVis] = React.useState(false)
  React.useEffect(() => {
    const el = ref.current
    if (!el) return
    let done = false
    const cleanup = () => {
      removeEventListener('scroll', check, true); removeEventListener('resize', check)
      clearTimeout(t1); clearTimeout(t2); cancelAnimationFrame(raf)
    }
    const reveal = () => { if (!done) { done = true; setVis(true); cleanup() } }
    function check() {
      const r = el.getBoundingClientRect()
      if (r.top < innerHeight * 0.95 && r.bottom > 0) reveal()
    }
    const raf = requestAnimationFrame(check)
    const t1 = setTimeout(check, 200)
    const t2 = setTimeout(reveal, 1500) // failsafe: never leave content hidden
    addEventListener('scroll', check, true); addEventListener('resize', check)
    check()
    return cleanup
  }, [])
  return [ref, vis]
}

function useCounter(end, dur = 1800, active = false) {
  const [val, setVal] = React.useState(0)
  React.useEffect(() => {
    if (!active) return
    const t0 = performance.now(); let raf
    const tick = t => {
      const p = Math.min((t-t0)/dur,1)
      setVal(Math.round((1-Math.pow(1-p,3))*end))
      if (p<1) raf = requestAnimationFrame(tick)
    }
    raf = requestAnimationFrame(tick)
    return () => cancelAnimationFrame(raf)
  }, [active, end, dur])
  return val
}

/* ── Reveal ─────────────────────────────────────────────── */
function Reveal({ delay=0, style, children, ...rest }) {
  const [ref, vis] = useReveal()
  return (
    <div ref={ref} {...rest} style={{
      opacity: vis?1:0,
      transform: vis?'translateY(0)':'translateY(22px)',
      transition:`opacity .75s cubic-bezier(.4,0,.2,1) ${delay}s,transform .75s cubic-bezier(.4,0,.2,1) ${delay}s`,
      ...style,
    }}>{children}</div>
  )
}

/* ── Navbar ──────────────────────────────────────────────── */
function Navbar() {
  const theme = useTheme()
  const [open, setOpen] = React.useState(false)
  const [scrolled, setScrolled] = React.useState(false)
  const [progress, setProgress] = React.useState(0)
  const links = [
    {label:'Quiénes somos',href:'#quienes'},
    {label:'Servicios',href:'#servicios'},
    {label:'Clientes',href:'#clientes'},
    {label:'Clinova',href:'clinova.html'},
    {label:'Contacto',href:'#contacto'},
  ]
  React.useEffect(() => {
    const fn = () => {
      setScrolled(window.scrollY>50)
      const el = document.documentElement
      const sc = el.scrollHeight - el.clientHeight
      setProgress(sc>0 ? window.scrollY/sc : 0)
    }
    window.addEventListener('scroll', fn)
    return () => window.removeEventListener('scroll', fn)
  }, [])
  return (
    <nav style={{position:'fixed',top:0,left:0,right:0,zIndex:200,height:64,
      display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 5vw',
      background:scrolled?`${theme.bgDeep}f2`:`${theme.bgDeep}bb`,
      backdropFilter:'blur(24px)',
      borderBottom:`1px solid ${scrolled?theme.accentBorder:'rgba(76,201,240,0.06)'}`,
      transition:'background .3s,border-color .3s',
    }}>
      <div style={{position:'absolute',bottom:0,left:0,height:2,width:`${progress*100}%`,
        background:theme.grad,transition:'width .1s linear',zIndex:1}}/>
      <a href="#" style={{display:'flex',alignItems:'center',gap:10}}>
        <GisosaLogo size={30}/>
        <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,
          fontSize:'1.3rem',letterSpacing:'.12em',color:theme.textPrimary}}>GISOSA</span>
      </a>
      <ul style={{display:'flex',alignItems:'center',gap:'2rem',listStyle:'none'}} className="hide-mob">
        {links.map(l => (
          <li key={l.href}>
            <a href={l.href} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:'.7rem',
              letterSpacing:'.12em',textTransform:'uppercase',color:theme.textSecondary,transition:'color .2s'}}
              onMouseEnter={e=>e.currentTarget.style.color=theme.accent}
              onMouseLeave={e=>e.currentTarget.style.color=theme.textSecondary}
            >{l.label}</a>
          </li>
        ))}
        <li>
          <a href="#contacto" style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,
            fontSize:'.85rem',letterSpacing:'.08em',textTransform:'uppercase',
            background:theme.grad,color:'#050608',padding:'8px 22px',borderRadius:3,
            display:'inline-block',transition:'opacity .2s,transform .2s'}}
            onMouseEnter={e=>{e.currentTarget.style.opacity='.85';e.currentTarget.style.transform='translateY(-1px)'}}
            onMouseLeave={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.transform='translateY(0)'}}
          >Contáctenos</a>
        </li>
      </ul>
      <button onClick={()=>setOpen(!open)} className="show-mob" aria-label="Menú"
        style={{background:'none',border:'none',cursor:'pointer',display:'flex',
          flexDirection:'column',gap:5,padding:4}}>
        {[0,1,2].map(i=>(
          <span key={i} style={{display:'block',width:22,height:1.5,
            background:theme.textPrimary,borderRadius:2,
            transform:open&&i===0?'rotate(45deg) translate(4px,4px)':open&&i===2?'rotate(-45deg) translate(4px,-4px)':'none',
            opacity:open&&i===1?0:1,transition:'transform .25s,opacity .25s'}}/>
        ))}
      </button>
      {open&&(
        <div style={{position:'absolute',top:64,left:0,right:0,
          background:`${theme.bgMid}f8`,backdropFilter:'blur(20px)',
          borderBottom:`1px solid ${theme.accentBorder}`,padding:'1.5rem 5vw'}}>
          {links.map(l=>(
            <a key={l.href} href={l.href} onClick={()=>setOpen(false)} style={{
              display:'block',padding:'.8rem 0',fontFamily:"'Barlow Condensed',sans-serif",
              fontWeight:700,fontSize:'1.15rem',letterSpacing:'.08em',textTransform:'uppercase',
              color:theme.textSecondary,borderBottom:'1px solid rgba(255,255,255,.05)'
            }}>{l.label}</a>
          ))}
          <a href="#contacto" onClick={()=>setOpen(false)} style={{
            display:'inline-block',marginTop:'1rem',background:theme.grad,color:'#050608',
            fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:'.9rem',
            letterSpacing:'.08em',textTransform:'uppercase',padding:'10px 24px',borderRadius:3,
          }}>Contáctenos</a>
        </div>
      )}
    </nav>
  )
}

/* ── Hero Visuals ────────────────────────────────────────── */
function HeroNetwork() {

  const u = React.useId().replace(/:/g,'x')

    {x:148,y:448},{x:318,y:438}]
  const edges=[[0,1],[1,2],[0,3],[1,4],[2,5],[5,6],[3,4],[4,5],[5,9],[6,9],[6,10],
    [3,7],[4,8],[7,8],[8,9],[9,10],[7,11],[8,11],[8,12],[9,12],[11,12]]
  const accents=[4,8,9]
  return (
    <div style={{position:'relative',width:'100%',height:'100%',minHeight:360}}>
      <svg viewBox="0 0 500 500" style={{width:'100%',height:'100%',position:'absolute',inset:0}}>
        <defs>
          <linearGradient id={`ng${u}`} x1="0" y1="0" x2="1" y2="1">
            <stop stopColor="#4CC9F0"/><stop offset="1" stopColor="#0077B6"/>
          </linearGradient>
          <filter id={`gw${u}`}><feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        {edges.map(([a,b],i)=>(
          <line key={i} x1={nodes[a].x} y1={nodes[a].y} x2={nodes[b].x} y2={nodes[b].y}
            stroke="rgba(76,201,240,0.18)" strokeWidth="1"/>
        ))}
        {nodes.map((n,i)=>(
          <g key={i}>
            {accents.includes(i)&&(
              <circle cx={n.x} cy={n.y} r="18" fill="none"
                stroke="rgba(76,201,240,0.18)" strokeWidth="1"
                style={{animation:`spin-slow ${8+i}s linear infinite`}}/>
            )}
            <circle cx={n.x} cy={n.y} r={accents.includes(i)?6:3.5}
              fill={`url(#ng${u})`}
              filter={accents.includes(i)?`url(#gw${u})`:undefined}

        ))}

        {label:'Cobertura',value:'Nacional',s:{bottom:'12%',right:'5%'},anim:'float 5.5s ease-in-out infinite reverse'},

        <div key={c.label} style={{position:'absolute',...c.s,

          borderRadius:10,padding:'10px 16px',backdropFilter:'blur(16px)',
          animation:c.anim}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:'.58rem',
            color:theme.accent,letterSpacing:'.12em',textTransform:'uppercase',marginBottom:3}}>{c.label}</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,
            fontSize:'.95rem',color:theme.textPrimary}}>{c.value}</div>
        </div>
      ))}
    </div>
  )
}
