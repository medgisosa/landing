/* ── Hooks ───────────────────────────────────────────────── */
function useReveal(threshold=0.12){
  const ref=React.useRef(null), [vis,setVis]=React.useState(false)
  React.useEffect(()=>{
    const el=ref.current
    if(!el)return
    let done=false
    const cleanup=()=>{
      removeEventListener('scroll',check,true); removeEventListener('resize',check)
      clearTimeout(t1); clearTimeout(t2); cancelAnimationFrame(raf)
    }
    const reveal=()=>{ if(!done){ done=true; setVis(true); cleanup() } }
    function check(){
      const r=el.getBoundingClientRect()
      if(r.top<innerHeight*0.95 && r.bottom>0) reveal()
    }
    const raf=requestAnimationFrame(check)
    const t1=setTimeout(check,200)
    const t2=setTimeout(reveal,1500) // failsafe: never leave content hidden
    addEventListener('scroll',check,true); addEventListener('resize',check)
    check()
    return cleanup
  },[])
  return [ref,vis]
}
function useCounter(end,dur=1800,active=false){
  const [val,setVal]=React.useState(0)
  React.useEffect(()=>{
    if(!active)return
    const t0=performance.now(); let raf
    const tick=t=>{const p=Math.min((t-t0)/dur,1);setVal(Math.round((1-Math.pow(1-p,3))*end));if(p<1)raf=requestAnimationFrame(tick)}
    raf=requestAnimationFrame(tick); return()=>cancelAnimationFrame(raf)
  },[active,end,dur])
  return val
}
function Reveal({delay=0,style,children,...rest}){
  const [ref,vis]=useReveal()
  return <div ref={ref} {...rest} style={{opacity:vis?1:0,transform:vis?'translateY(0)':'translateY(22px)',
    transition:`opacity .75s cubic-bezier(.4,0,.2,1) ${delay}s,transform .75s cubic-bezier(.4,0,.2,1) ${delay}s`,...style}}>{children}</div>
}

/* ── Navbar ──────────────────────────────────────────────── */
function Navbar(){
  const [scrolled,setScrolled]=React.useState(false)
  const [progress,setProgress]=React.useState(0)
  React.useEffect(()=>{
    const fn=()=>{
      setScrolled(window.scrollY>50)
      const el=document.documentElement
      setProgress((el.scrollHeight-el.clientHeight)>0?window.scrollY/(el.scrollHeight-el.clientHeight):0)
    }
    window.addEventListener('scroll',fn); return()=>window.removeEventListener('scroll',fn)
  },[])
  return (
    <nav style={{position:'fixed',top:0,left:0,right:0,zIndex:200,height:64,
      display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 5vw',
      background:scrolled?`${T.bgDeep}f2`:`${T.bgDeep}bb`,
      backdropFilter:'blur(24px)',
      borderBottom:`1px solid ${scrolled?T.accentBorder:'rgba(76,201,240,0.06)'}`,
      transition:'background .3s,border-color .3s'}}>
      <div style={{position:'absolute',bottom:0,left:0,height:2,width:`${progress*100}%`,
        background:T.grad,transition:'width .1s linear',zIndex:1}}/>
      {/* Back to GISOSA */}
